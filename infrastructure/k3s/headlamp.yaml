apiVersion: v1
kind: Namespace
metadata:
  name: kubernetes-ui

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: kubernetes-ui

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: kubernetes-ui
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 240

  selector:
    matchLabels:
      app: headlamp

  template:
    metadata:
      labels:
        app: headlamp

    spec:
      serviceAccountName: headlamp

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.46.0
          imagePullPolicy: IfNotPresent

          args:
            - "-in-cluster"

          env:
            - name: HOME
              value: /tmp
            - name: HEADLAMP_CONFIG_TRACING_ENABLED
              value: "false"
            - name: HEADLAMP_CONFIG_METRICS_ENABLED
              value: "false"

          ports:
            - name: http
              containerPort: 4466

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            - name: temporary
              mountPath: /tmp

      volumes:
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: kubernetes-ui
spec:
  type: NodePort
  selector:
    app: headlamp
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30466
